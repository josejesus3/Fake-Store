<section>
  <h2>Productos</h2>

  <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
    <div class="p-2 pb-1">
      <h5 class="fw-bold m-0">Categorias</h5>
    </div>
    <div class="list-group list-group-flush">
      @for (item of categories; track $index) {
        <button
          class="list-group-item list-group-item-action d-flex justify-content-between fs-5"
       
        >
          {{ item | titlecase }}<i class="bi bi-chevron-right"></i>
        </button>
      }
    </div>
  </div>
</section>
